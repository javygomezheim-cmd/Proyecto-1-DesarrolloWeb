<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de gestión de actividades académicas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>

        <h1>Actividades académicas</h1>

        <button id="btn-agregar-asignatura">Nueva Asignatura</button>
        <button id="btn-agregar-tarea">Nueva tarea</button>
        <button id="btn-Historial">Historial</button>
        <button id="btn-filtro">Filtro</button>

    </header>


    <div class="contenido">


        <aside>

            <section>

                <p>Fecha actual</p>

                <p id="fecha-actual"></p>

            </section>


            <section>

                <h2>Mis tareas</h2>

                <ul id="lista-tareas">

                    <li>
                        <button>Tarea 1</button>
                    </li>

                    <li>
                        <button>Tarea 2</button>
                    </li>

                    <li>
                        <button>Tarea 3</button>
                    </li>

                </ul>

            </section>

        </aside>


        <main>

            <h2>Detalles de la actividad</h2>

            <section id="detalle-tarea">

                <h3>Selecciona una tarea</h3>

                <p>
                    Selecciona una actividad de la lista
                    para ver su información.
                </p>

            </section>

        </main>

    </div>

</body>

</html>
